<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Check-in System</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #fce4ec;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background-color: #d81b60;
            color: white;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 20px;
            padding: 20px;
            text-align: center;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #f8bbd0;
        }
        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #888;
        }
        .tab.active {
            color: #d81b60;
            border-bottom: 3px solid #d81b60;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #f8bbd0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button.btn-submit {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button.btn-submit:active {
            background-color: #ad1457;
        }
    </style>
</head>
<body>

    <div class="header">EVENT CHECK-IN</div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('scan')">📷 สแกน QR Code</div>
            <div class="tab" onclick="switchTab('manual')">⌨️ กรอกรหัสเอง</div>
        </div>

        <div id="scan" class="tab-content active">
            <div id="reader"></div>
        </div>

        <div id="manual" class="tab-content">
            <p>ระบุรหัสตั๋วที่นั่ง (RefCode)</p>
            <input type="text" id="refCodeInput" placeholder="ตัวอย่าง: RC3-23401110403-B8">
            <button class="btn-submit" onclick="submitManualCode()">ตรวจสอบข้อมูล</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. นำ URL ของ Web App มาใส่ตรงนี้
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8W0TEaMnn3AyMtt2TuSIO4r3Jrj7kkT0fN9Rxv6Rw2Rqqyce0fjtI2WyoX40Sb3Ru/exec"; 

        let html5QrcodeScanner;
        let isProcessing = false;

        function speakSuccess() {
            if ('speechSynthesis' in window) {
                let msg = new SpeechSynthesisUtterance('ผ่านค่ะ');
                msg.lang = 'th-TH';
                msg.rate = 1.0;
                window.speechSynthesis.speak(msg);
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'manual' && html5QrcodeScanner) {
                html5QrcodeScanner.pause();
            } else if (tabId === 'scan' && html5QrcodeScanner) {
                html5QrcodeScanner.resume();
            }
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return; 
            
            isProcessing = true;
            html5QrcodeScanner.pause(); 
            processCheckIn(decodedText);
        }

        function submitManualCode() {
            const code = document.getElementById('refCodeInput').value.trim();
            if (!code) {
                Swal.fire({ icon: 'warning', title: 'กรุณาระบุรหัส', confirmButtonColor: '#d81b60' });
                return;
            }
            processCheckIn(code);
        }

        function processCheckIn(rawText) {
            let actualRefCode = rawText.trim();

            if (actualRefCode.match(/Ref:/i)) {
                let match = actualRefCode.match(/Ref:\s*([^|]+)/i);
                if (match && match[1]) {
                    actualRefCode = match[1].trim(); 
                }
            } else if (actualRefCode.includes('|')) {
                actualRefCode = actualRefCode.split('|')[0].trim();
            }

            Swal.fire({
                title: 'กำลังตรวจสอบข้อมูล...',
                text: `รหัส: ${actualRefCode}`,
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 'refCode': actualRefCode })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    speakSuccess();
                    Swal.fire({
                        icon: 'success',
                        title: 'เข้าร่วมกิจกรรมสำเร็จ',
                        text: `ที่นั่งของคุณคือ: ${data.seatID}`,
                        confirmButtonColor: '#d81b60'
                    });
                    document.getElementById('refCodeInput').value = '';
                } 
                else if (data.status === 'not_found') {
                    Swal.fire({
                        icon: 'error',
                        title: 'ไม่พบข้อมูล',
                        text: 'ไม่พบข้อมูลการสำรองที่นั่งของท่าน โปรดตรวจสอบตั๋วที่นั่งให้ถูกต้อง',
                        confirmButtonColor: '#d81b60'
                    });
                } 
                else if (data.status === 'duplicate') {
                    Swal.fire({
                        icon: 'warning',
                        title: 'เช็คอินซ้ำ',
                        text: `ที่นั่งนี้ถูกใช้งานแล้วเวลา ${data.time}`,
                        confirmButtonColor: '#d81b60'
                    });
                } 
                else {
                    throw new Error(data.message);
                }
            })
            .catch(error => {
                Swal.fire({
                    icon: 'error',
                    title: 'การเชื่อมต่อขัดข้อง',
                    text: 'โปรดตรวจสอบสัญญาณอินเทอร์เน็ตแล้วลองอีกครั้ง',
                    confirmButtonColor: '#d81b60'
                });
                console.error('Error:', error);
            })
            .finally(() => {
                isProcessing = false;
                if (html5QrcodeScanner && document.getElementById('scan').classList.contains('active')) {
                    setTimeout(() => { html5QrcodeScanner.resume(); }, 2000); 
                }
            });
        }

        window.onload = function() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess, (error) => {});
        };
    </script>
</body>
</html>
